name: Web (Couch Multiplayer) Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Export
        working-directory: ./frontend
        run: npm run export
        env:
          EXPO_PUBLIC_SERVER_URL: ${{ secrets.PROD_SERVER_URL }}

